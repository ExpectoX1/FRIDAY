<svg width="100%" viewBox="0 0 680 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>FRIDAY backend architecture</title>
<desc>Layered wire diagram: voice I/O feeds main.py, which routes to the brain (single-shot or agent loop) over Ollama/Groq, dispatches tools via the registry, and connects to infra and external services, plus a bridge to the SwiftUI frontend.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .lbl { fill: #2C2C2A; }
  rect.bg { fill: #ffffff; }
  .c-purple rect { fill: #EEEDFE; stroke: #7F77DD; }
  .c-purple text { fill: #26215C; }
  .c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
  .c-teal text { fill: #04342C; }
  .c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber text { fill: #412402; }
  .c-gray rect { fill: #F1EFE8; stroke: #888780; }
  .c-gray text { fill: #2C2C2A; }
  .edge { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs>
