<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRIDAY — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0c10;
    color: #e2e8f0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── top bar ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: 48px;
    background: rgba(10,12,16,0.92);
    border-bottom: 1px solid #1e2533;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    backdrop-filter: blur(8px);
  }
  #topbar .logo { font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #60a5fa; }
  #topbar .subtitle { font-size: 11px; color: #64748b; }
  .spacer { flex: 1; }
  .stat-chip {
    background: #111827; border: 1px solid #1e2533; border-radius: 6px;
    padding: 3px 10px; font-size: 11px; color: #94a3b8;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-chip span { color: #e2e8f0; font-weight: 600; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; transition: background 0.4s;
  }
  #status-dot.live { background: #22c55e; }

  /* ── canvas ── */
  #graph-container {
    position: fixed; inset: 48px 280px 0 0;
  }
  svg { width: 100%; height: 100%; }

  /* ── links ── */
  .link { stroke-opacity: 0.6; }
  .link.active { stroke: #3b82f6; }
  .link.expired { stroke: #374151; stroke-dasharray: 4 3; stroke-opacity: 0.35; }

  .link-label {
    font-size: 9px; fill: #475569; pointer-events: none;
    text-anchor: middle;
  }
  .link-label.active { fill: #60a5fa; }

  /* ── nodes ── */
  .node circle {
    stroke-width: 1.5;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .node circle:hover { filter: brightness(1.4); }
  .node text {
    font-size: 11px; fill: #e2e8f0; pointer-events: none;
    text-anchor: middle; dy: "0.35em";
  }

  /* ── right panel ── */
  #panel {
    position: fixed; top: 48px; right: 0; bottom: 0; width: 280px;
    background: #0d1117;
    border-left: 1px solid #1e2533;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-section { padding: 14px 16px; border-bottom: 1px solid #1e2533; }
  .panel-section h3 { font-size: 10px; letter-spacing: 2px; color: #475569; text-transform: uppercase; margin-bottom: 10px; }

  /* legend */
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #94a3b8; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* filters */
  .filter-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .filter-btn {
    font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer;
    border: 1px solid; background: transparent; font-family: inherit;
    transition: opacity 0.2s;
  }
  .filter-btn.off { opacity: 0.3; }

  /* entity list */
  #entity-list { flex: 1; overflow-y: auto; padding: 0; }
  #entity-list::-webkit-scrollbar { width: 4px; }
  #entity-list::-webkit-scrollbar-track { background: transparent; }
  #entity-list::-webkit-scrollbar-thumb { background: #1e2533; border-radius: 2px; }
  .entity-item {
    padding: 8px 16px; border-bottom: 1px solid #0d1117; cursor: pointer;
    transition: background 0.15s;
  }
  .entity-item:hover { background: #111827; }
  .entity-name { font-size: 12px; color: #e2e8f0; }
  .entity-meta { font-size: 10px; color: #475569; margin-top: 2px; }

  /* tooltip */
  #tooltip {
    position: fixed; z-index: 100;
    background: #111827; border: 1px solid #1e2533; border-radius: 8px;
    padding: 10px 14px; pointer-events: none; opacity: 0;
    transition: opacity 0.15s; max-width: 260px;
    font-size: 11px; line-height: 1.6;
  }
  #tooltip .tt-title { font-weight: 700; font-size: 13px; color: #60a5fa; margin-bottom: 6px; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
  #tooltip .tt-key { color: #475569; }
  #tooltip .tt-val { color: #e2e8f0; text-align: right; }

  /* controls */
  #controls {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    display: flex; gap: 8px;
  }
  .ctrl-btn {
    background: #111827; border: 1px solid #1e2533; border-radius: 6px;
    color: #94a3b8; font-size: 18px; width: 34px; height: 34px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .ctrl-btn:hover { background: #1e2533; color: #e2e8f0; }

  #search-box {
    background: #111827; border: 1px solid #1e2533; border-radius: 6px;
    color: #e2e8f0; font-size: 12px; font-family: inherit;
    padding: 0 10px; height: 34px; width: 180px; outline: none;
  }
  #search-box:focus { border-color: #3b82f6; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">F R I D A Y</div>
  <div class="subtitle">Knowledge Graph</div>
  <div class="spacer"></div>
  <div class="stat-chip">Nodes <span id="stat-nodes">—</span></div>
  <div class="stat-chip">Active <span id="stat-active">—</span></div>
  <div class="stat-chip">Expired <span id="stat-expired">—</span></div>
  <div id="status-dot" title="WebSocket status"></div>
</div>

<!-- GRAPH SVG -->
<div id="graph-container">
  <svg id="graph-svg">
    <defs>
      <marker id="arrow-active" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6" />
      </marker>
      <marker id="arrow-expired" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#374151" />
      </marker>
    </defs>
    <g id="zoom-group">
      <g id="links-layer"></g>
      <g id="link-labels-layer"></g>
      <g id="nodes-layer"></g>
    </g>
  </svg>
</div>

<!-- RIGHT PANEL -->
<div id="panel">
  <div class="panel-section">
    <h3>Node Types</h3>
    <div id="legend"></div>
  </div>
  <div class="panel-section">
    <h3>Show / Hide</h3>
    <div class="filter-row" id="filter-btns"></div>
  </div>
  <div class="panel-section" style="padding-bottom:8px">
    <h3>Entities</h3>
    <input id="search-box" type="text" placeholder="Search…" />
  </div>
  <div id="entity-list"></div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">+</button>
  <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">−</button>
  <button class="ctrl-btn" id="btn-reset" title="Reset view" style="font-size:14px">⌖</button>
  <button class="ctrl-btn" id="btn-expired" title="Toggle expired" style="font-size:12px">⌛</button>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<script>
// =========================================================
// COLOR PALETTE
// =========================================================
const COLORS = {
  Person:       { fill: "#6366f1", stroke: "#818cf8" },
  Location:     { fill: "#0ea5e9", stroke: "#38bdf8" },
  Project:      { fill: "#8b5cf6", stroke: "#a78bfa" },
  Organization: { fill: "#ec4899", stroke: "#f472b6" },
  Tool:         { fill: "#14b8a6", stroke: "#2dd4bf" },
  SportsTeam:   { fill: "#f59e0b", stroke: "#fbbf24" },
  Product:      { fill: "#ef4444", stroke: "#f87171" },
  Event:        { fill: "#f97316", stroke: "#fb923c" },
  Preference:   { fill: "#22c55e", stroke: "#4ade80" },
  Habit:        { fill: "#a16207", stroke: "#ca8a04" },
  Emotion:      { fill: "#e879f9", stroke: "#f0abfc" },
  Entity:       { fill: "#334155", stroke: "#475569" },
};

const NODE_RADIUS = 18;

// =========================================================
// STATE
// =========================================================
let graphData = { nodes: [], links: [] };
let simulation = null;
let showExpired = false;
let hiddenLabels = new Set();
let searchQuery = "";
let selectedNode = null;

// =========================================================
// D3 SETUP
// =========================================================
const svg = d3.select("#graph-svg");
const zoomGroup = svg.select("#zoom-group");
const linksLayer = svg.select("#links-layer");
const labelsLayer = svg.select("#link-labels-layer");
const nodesLayer = svg.select("#nodes-layer");
const tooltip = document.getElementById("tooltip");

const zoom = d3.zoom()
  .scaleExtent([0.1, 4])
  .on("zoom", e => zoomGroup.attr("transform", e.transform));
svg.call(zoom);

function resetView() {
  const container = document.getElementById("graph-container");
  const w = container.clientWidth, h = container.clientHeight;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(w/2, h/2).scale(0.9));
}

document.getElementById("btn-zoom-in").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.3);
document.getElementById("btn-zoom-out").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.77);
document.getElementById("btn-reset").onclick = resetView;
document.getElementById("btn-expired").onclick = () => {
  showExpired = !showExpired;
  document.getElementById("btn-expired").style.color = showExpired ? "#60a5fa" : "#94a3b8";
  render(graphData);
};

// =========================================================
// SIMULATION
// =========================================================
function makeSimulation(nodes, links) {
  if (simulation) simulation.stop();
  const container = document.getElementById("graph-container");
  const w = container.clientWidth, h = container.clientHeight;
  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(120).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-350))
    .force("center", d3.forceCenter(w / 2, h / 2))
    .force("collide", d3.forceCollide(NODE_RADIUS + 8))
    .alphaDecay(0.03);
  return simulation;
}

// =========================================================
// TOOLTIP
// =========================================================
function showTooltip(html, x, y) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";
  tooltip.style.left = (x + 12) + "px";
  tooltip.style.top = (y - 10) + "px";
}
function hideTooltip() {
  tooltip.style.opacity = "0";
}

function nodeTooltipHTML(d) {
  const links = graphData.links.filter(l =>
    (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id
  );
  const active = links.filter(l => l.active).length;
  return `<div class="tt-title">${d.id}</div>
    <div class="tt-row"><span class="tt-key">Type</span><span class="tt-val">${d.label}</span></div>
    <div class="tt-row"><span class="tt-key">Connections</span><span class="tt-val">${links.length} (${active} active)</span></div>`;
}

function linkTooltipHTML(d) {
  const pct = v => v != null ? Math.round(v * 100) + "%" : "—";
  return `<div class="tt-title">${d.type.replace(/_/g, " ")}</div>
    <div class="tt-row"><span class="tt-key">Source</span><span class="tt-val">${d.source.id || d.source}</span></div>
    <div class="tt-row"><span class="tt-key">Target</span><span class="tt-val">${d.target.id || d.target}</span></div>
    <div class="tt-row"><span class="tt-key">Importance</span><span class="tt-val">${pct(d.importance)}</span></div>
    <div class="tt-row"><span class="tt-key">Confidence</span><span class="tt-val">${pct(d.confidence)}</span></div>
    <div class="tt-row"><span class="tt-key">Mentions</span><span class="tt-val">${d.mention_count ?? "—"}</span></div>
    <div class="tt-row"><span class="tt-key">Status</span><span class="tt-val">${d.active ? "Active" : "Expired"}</span></div>`;
}

// =========================================================
// RENDER
// =========================================================
function render(data) {
  const visLinks = data.links.filter(l => (showExpired || l.active) && !hiddenLabels.has(nodeLabel(l)));
  const visNodeIds = new Set();
  visLinks.forEach(l => {
    visNodeIds.add(l.source.id || l.source);
    visNodeIds.add(l.target.id || l.target);
  });
  const visNodes = data.nodes.filter(n => visNodeIds.has(n.id) && !hiddenLabels.has(n.label));

  // ── LINKS ──
  const linkSel = linksLayer.selectAll(".link")
    .data(visLinks, d => `${d.source?.id || d.source}|${d.type}|${d.target?.id || d.target}`);

  linkSel.exit().remove();

  const linkEnter = linkSel.enter().append("line")
    .attr("class", d => "link " + (d.active ? "active" : "expired"))
    .attr("stroke-width", d => Math.max(1, (d.importance || 0.3) * 3))
    .attr("marker-end", d => d.active ? "url(#arrow-active)" : "url(#arrow-expired)")
    .on("mousemove", (event, d) => showTooltip(linkTooltipHTML(d), event.clientX, event.clientY))
    .on("mouseleave", hideTooltip);

  linkSel.merge(linkEnter)
    .attr("class", d => "link " + (d.active ? "active" : "expired"))
    .attr("stroke-width", d => Math.max(1, (d.importance || 0.3) * 3));

  // ── LINK LABELS ──
  const labelSel = labelsLayer.selectAll(".link-label")
    .data(visLinks, d => `${d.source?.id || d.source}|${d.type}|${d.target?.id || d.target}`);

  labelSel.exit().remove();

  labelSel.enter().append("text")
    .attr("class", d => "link-label " + (d.active ? "active" : ""))
    .text(d => d.type.replace(/_/g, " "));

  // ── NODES ──
  const nodeSel = nodesLayer.selectAll(".node")
    .data(visNodes, d => d.id);

  nodeSel.exit().remove();

  const nodeEnter = nodeSel.enter().append("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end", (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    )
    .on("mousemove", (event, d) => showTooltip(nodeTooltipHTML(d), event.clientX, event.clientY))
    .on("mouseleave", hideTooltip)
    .on("click", (event, d) => focusNode(d));

  nodeEnter.append("circle")
    .attr("r", NODE_RADIUS)
    .attr("fill", d => (COLORS[d.label] || COLORS.Entity).fill)
    .attr("stroke", d => (COLORS[d.label] || COLORS.Entity).stroke);

  nodeEnter.append("text")
    .attr("dy", NODE_RADIUS + 13)
    .text(d => d.id.length > 14 ? d.id.slice(0, 13) + "…" : d.id);

  // ── SIMULATION ──
  const allLinksForSim = visLinks.map(l => ({ ...l })); // shallow copy for D3 mutation
  const sim = makeSimulation(visNodes, allLinksForSim);

  const allLinks = linksLayer.selectAll(".link");
  const allLabels = labelsLayer.selectAll(".link-label");
  const allNodes = nodesLayer.selectAll(".node");

  sim.on("tick", () => {
    allLinks
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => clampLink(d).x2).attr("y2", d => clampLink(d).y2);

    allLabels
      .attr("x", d => ((d.source.x || 0) + (d.target.x || 0)) / 2)
      .attr("y", d => ((d.source.y || 0) + (d.target.y || 0)) / 2);

    allNodes.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  updateSidebar(data.nodes);
}

function clampLink(d) {
  const dx = (d.target.x || 0) - (d.source.x || 0);
  const dy = (d.target.y || 0) - (d.source.y || 0);
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const r = NODE_RADIUS + 6;
  return {
    x2: (d.target.x || 0) - (dx / dist) * r,
    y2: (d.target.y || 0) - (dy / dist) * r,
  };
}

// =========================================================
// FOCUS
// =========================================================
function focusNode(d) {
  selectedNode = d.id;
  const container = document.getElementById("graph-container");
  const w = container.clientWidth, h = container.clientHeight;
  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(w / 2 - d.x, h / 2 - d.y).scale(1.4)
  );
  // highlight entity in sidebar
  document.querySelectorAll(".entity-item").forEach(el => {
    el.style.background = el.dataset.id === d.id ? "#1e2533" : "";
  });
  const el = document.querySelector(`.entity-item[data-id="${CSS.escape(d.id)}"]`);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

// =========================================================
// SIDEBAR
// =========================================================
function nodeLabel(link) {
  // used for hiding all links of a node-label type (not used currently)
  return null;
}

function buildLegend(nodes) {
  const labels = [...new Set(nodes.map(n => n.label))].sort();
  const legend = document.getElementById("legend");
  const filterBtns = document.getElementById("filter-btns");
  legend.innerHTML = "";
  filterBtns.innerHTML = "";
  labels.forEach(label => {
    const c = (COLORS[label] || COLORS.Entity).fill;
    legend.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${c}"></div>${label}</div>`;

    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = label;
    btn.style.color = c;
    btn.style.borderColor = c;
    btn.dataset.label = label;
    btn.onclick = () => {
      if (hiddenLabels.has(label)) {
        hiddenLabels.delete(label);
        btn.classList.remove("off");
      } else {
        hiddenLabels.add(label);
        btn.classList.add("off");
      }
      render(graphData);
    };
    filterBtns.appendChild(btn);
  });
}

function updateSidebar(nodes) {
  buildLegend(nodes);
  const list = document.getElementById("entity-list");
  const q = searchQuery.toLowerCase();
  const filtered = nodes.filter(n => !q || n.id.toLowerCase().includes(q));
  filtered.sort((a, b) => a.id.localeCompare(b.id));
  list.innerHTML = filtered.map(n => {
    const c = (COLORS[n.label] || COLORS.Entity).fill;
    const conns = graphData.links.filter(l =>
      (l.source?.id || l.source) === n.id || (l.target?.id || l.target) === n.id
    ).length;
    return `<div class="entity-item" data-id="${n.id}" onclick="focusEntityById('${n.id.replace(/'/g,"\\'")}')">
      <div class="entity-name" style="color:${c}">${n.id}</div>
      <div class="entity-meta">${n.label} · ${conns} link${conns !== 1 ? "s" : ""}</div>
    </div>`;
  }).join("");
}

function focusEntityById(id) {
  const node = graphData.nodes.find(n => n.id === id);
  if (node && node.x != null) focusNode(node);
}

document.getElementById("search-box").addEventListener("input", e => {
  searchQuery = e.target.value;
  updateSidebar(graphData.nodes);
});

// =========================================================
// STATS
// =========================================================
async function refreshStats() {
  try {
    const r = await fetch("/api/stats");
    const d = await r.json();
    document.getElementById("stat-nodes").textContent = d.nodes;
    document.getElementById("stat-active").textContent = d.active_rels;
    document.getElementById("stat-expired").textContent = d.expired_rels;
  } catch {}
}

// =========================================================
// WEBSOCKET
// =========================================================
const dot = document.getElementById("status-dot");

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/graph`);

  ws.onopen = () => { dot.classList.add("live"); };
  ws.onclose = () => {
    dot.classList.remove("live");
    setTimeout(connect, 3000); // reconnect
  };
  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "graph") {
      const isFirst = graphData.nodes.length === 0;
      graphData = msg.data;
      render(graphData);
      refreshStats();
      if (isFirst) setTimeout(resetView, 200);
    }
  };
}

// =========================================================
// BOOT
// =========================================================
window.focusEntityById = focusEntityById;
connect();
refreshStats();
setInterval(refreshStats, 10000);
</script>
</body>
</html>
